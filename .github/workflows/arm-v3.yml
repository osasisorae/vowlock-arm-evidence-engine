name: Arm64 V3 runtime policy

on:
  workflow_dispatch:
    inputs:
      runner:
        description: Registered Arm host image
        required: true
        default: ubuntu-22.04-arm
        type: choice
        options:
          - ubuntu-22.04-arm
          - ubuntu-24.04-arm

permissions:
  contents: read

jobs:
  registered-v3:
    name: V3 on ${{ inputs.runner }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 300

    steps:
      - name: Check out frozen source
        uses: actions/checkout@v6

      - name: Prove the native Arm host
        run: |
          uname -a
          test "$(uname -m)" = "aarch64"
          lscpu
          test "$(getconf _NPROCESSORS_ONLN)" -ge 4

      - name: Install open-source build requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake curl git python3

      - name: Run model-free apparatus tests
        run: |
          python3 -m unittest discover -s tests -v
          python3 v3_runtime.py validate
          python3 setup_companion_eval_v3.py --fixtures fixtures/setup-companion-v3-development.json mutation-test --output results/v3-mutation-preflight.json
          python3 setup_companion_eval_v3.py --fixtures fixtures/setup-companion-v3-sealed.json demo --output results/v3-sealed-reference-preflight.json

      - name: Cache the pinned retained model
        uses: actions/cache@v5
        with:
          path: model/*.gguf
          key: v3-qwen15-q4-${{ runner.arch }}-dcd819ff

      - name: Run the registered V3 study
        env:
          V3_HOST_LABEL: ${{ inputs.runner }}
        run: ./scripts/run-v3.sh

      - name: Preserve all Version 3 evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: arm64-v3-evidence-${{ inputs.runner }}-${{ github.run_id }}
          path: results/v3/
          if-no-files-found: warn
          retention-days: 30
